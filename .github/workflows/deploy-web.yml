name: Deploy web app

# Builds the Flutter web app and publishes it to GitHub Pages, so the app can
# be opened from any phone or laptop browser without installing anything:
#   https://aadityadixit444.github.io/KisanSetu/
#
# Note: the Hindi -> English voice translation (Google ML Kit) only runs on
# Android / iOS, so on the web the field keeps the Hindi text. Everything else
# works, including Supabase.
on:
  push:
    branches: [backend-integration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - run: flutter pub get

      # Project pages are served from /KisanSetu/, so the base href must match.
      - run: flutter build web --release --base-href /KisanSetu/

      # GitHub Pages serves 404.html for unknown paths; reuse index.html so a
      # refresh on any route still loads the app.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
