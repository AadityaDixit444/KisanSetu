name: Build Android APK

# Builds a release APK in the cloud so anyone can install the app from a
# phone: open the repo -> Releases -> tap the .apk.
#
# Runs on every push to backend-integration, and can be started by hand from
# the Actions tab (also works from a phone browser).
on:
  push:
    branches: [backend-integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK with the build number
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/KisanSetu-build${{ github.run_number }}.apk

      # Keeps the APK on the workflow run itself (Actions -> this run -> Artifacts)
      - uses: actions/upload-artifact@v4
        with:
          name: KisanSetu-apk
          path: dist/*.apk

      # And publishes it as a Release, which is the phone-friendly download
      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KisanSetu build ${{ github.run_number }}
          body: |
            Debug-signed APK built from `${{ github.sha }}`.

            Install on Android: tap the `.apk` below, then allow
            "install from unknown sources" when the phone asks.
          files: dist/*.apk
